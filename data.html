<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PARKNEWS · 자료 내려받기</title>
<meta name="description" content="국립공원 뉴스·검색관심도 데이터셋 내려받기" />
<meta name="theme-color" content="#080b13" />
<link rel="icon" href="assets/img/knps-mark.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="db-page">

<header class="topbar glass">
  <a class="brand" href="./">
    <span class="brand__mark"></span>
    <div>
      <h1>PARKNEWS</h1>
      <p>자료 내려받기</p>
    </div>
  </a>
  <div class="topbar__stats">
    <a class="dlbtn dlbtn--dash" href="dashboard.html">섹터 뉴스</a>
    <a class="dlbtn dlbtn--stat" href="./">지도 돌아가기</a>
  </div>
</header>

<main class="db-wrap">
  <div class="db-head">
    <h2>데이터셋 내려받기</h2>
    <p>국립공원 뉴스와 검색 관심도를 정리한 자료입니다.
       기사 <b>본문은 담지 않았고</b> 제목·요약·매체·링크만 있습니다 (언론사 저작물).</p>
    <p><b>CSV 파일은 눌러서 바로 엑셀로 열립니다.</b>
       용량이 큰 것만 ZIP 으로 묶여 있으니 압축을 풀고 쓰십시오.</p>
    <p>‘최신 30일’ 증분은 <b>매일 아침</b>, 전체판은 <b>매주 일요일</b> 새로 만듭니다.
       증분과 전체판은 컬럼이 같아 이어 붙여 쓸 수 있습니다.</p>
  </div>

  <div class="ds-list" id="ds-list">
    <p class="db-empty">목록을 불러오는 중…</p>
  </div>

  <p class="db-src" id="ds-note"></p>
</main>

<script>
(async () => {
  const box = document.getElementById('ds-list');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mb = (n) => (n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + 'MB'
                                      : Math.max(1, Math.round(n / 1024)) + 'KB');
  try {
    const r = await fetch('data/dataset/index.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    const files = d.items.filter((i) => i.gz);
    const docs = d.items.filter((i) => !i.gz);

    box.innerHTML = files.map((i) => `
      <a class="ds-row" href="data/dataset/${encodeURIComponent(i.file)}" download>
        <div class="ds-main">
          <b>${esc(i.name.replace(/\.csv$/, ''))}${
            i.file.includes('최신30일') ? ' <span class="ds-badge">매일 갱신</span>' : ''}</b>
          ${i.desc ? `<em>${esc(i.desc)}</em>` : ''}
        </div>
        <span class="ds-rows">${i.rows.toLocaleString()}행</span>
        <span class="ds-size">${mb(i.size)}<small>${
          i.packed ? `ZIP · 풀면 ${mb(i.rawSize)}` : 'CSV · 바로 열림'}</small></span>
      </a>`).join('')
      + (docs.length ? `<div class="ds-docs">${docs.map((i) =>
          `<a href="data/dataset/${encodeURIComponent(i.file)}" target="_blank" rel="noopener">📄 ${esc(i.name)}</a>`
        ).join('')}</div>` : '');

    document.getElementById('ds-note').innerHTML =
      `생성 ${esc((d.generatedAt || '').slice(0, 10))} · ${esc(d.note || '')}`;
  } catch (e) {
    box.innerHTML = `<p class="db-empty">아직 올려둔 자료가 없습니다.<br>
      <small>tools/publish_dataset.py 를 실행한 뒤 배포하면 여기에 표시됩니다.</small></p>`;
  }
})();
</script>
</body>
</html>
