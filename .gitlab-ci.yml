# =============================================================
#  GitLab CI — 현재 꺼져 있습니다.
#
#  이 저장소의 GitLab(gitlab.aigov.go.kr)에는 CI 러너가 한 대도
#  없습니다. 그래서 파이프라인이 만들어져도 실행할 서버가 없어
#  80분쯤 대기하다 실패합니다. 푸시할 때마다 하나씩 쌓여서
#  2026-08-16 기준 19개(실패 3 · 취소 15 · 대기 1)가 남았습니다.
#
#  서비스는 Vercel(parknews.vercel.app)에서 돌고 GitLab은 소스
#  보관용으로만 씁니다. GitLab Pages로 배포할 계획이 없으므로
#  아래 workflow 규칙으로 파이프라인 생성 자체를 막습니다.
#
#  ※ 파일을 지우지 않고 남겨 두는 이유
#     .gitlab-ci.yml 이 없으면 Auto DevOps 가 켜져서, 정적 사이트를
#     Node 앱으로 오인해 build/test/code_quality 잡 6개를 만듭니다.
#     지금보다 더 많이 쌓입니다.
#
#  ▶ 다시 켜려면: 아래 workflow 블록 3줄만 지우세요.
#     러너가 생기면 pages 잡이 그대로 동작합니다.
# =============================================================

workflow:
  rules:
    - when: never

stages:
  - deploy

pages:
  stage: deploy
  image: alpine:latest
  script:
    # GitLab Pages는 public/ 디렉터리 안의 내용만 게시합니다.
    - mkdir -p public
    - cp index.html dashboard.html public/
    - cp -r assets public/

    # vercel.json 의 cleanUrls 대체 —
    # /dashboard 로도 열리도록 디렉터리 형태를 하나 더 만들어 둡니다.
    - mkdir -p public/dashboard
    - cp dashboard.html public/dashboard/index.html

    - echo "게시 대상:" && ls -R public | head -40
  artifacts:
    paths:
      - public
  rules:
    # 기본 브랜치(main)에 올라올 때만 배포합니다.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
