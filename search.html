<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PARKNEWS · 뉴스 검색</title>
<meta name="description" content="1990~2026년 국립공원 뉴스 5만여 건을 제목·연도·공원·분야로 검색" />
<meta name="theme-color" content="#080b13" />
<link rel="icon" href="assets/img/knps-mark.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="db-page">

<header class="topbar glass">
  <a class="brand" href="./">
    <span class="brand__mark"></span>
    <div>
      <h1>PARKNEWS</h1>
      <p>뉴스 검색</p>
    </div>
  </a>
  <div class="topbar__stats">
    <a class="dlbtn dlbtn--dash" href="dashboard.html">섹터 뉴스</a>
    <a class="dlbtn dlbtn--data" href="data.html">자료받기</a>
    <a class="dlbtn dlbtn--stat" href="./">지도 돌아가기</a>
  </div>
</header>

<main class="db-wrap">
  <div class="db-head">
    <h2>뉴스 검색 <small id="sc-total">…</small></h2>
    <p>제목으로 찾고, 연도·공원·분야로 좁힐 수 있습니다.
       <b>검색어 없이 연도만 골라도</b> 그 해 크게 다뤄진 사안이 순위로 나옵니다.</p>
  </div>

  <form class="sc-form" id="sc-form">
    <input type="search" id="sc-q" placeholder="제목 검색 (예: 반달가슴곰, 케이블카, 실종)" autocomplete="off" />
    <input type="search" id="sc-ex" class="sc-ex" autocomplete="off"
           placeholder="제외할 낱말 (예: 드라마 맛집 분양)"
           title="여기 적은 낱말이 제목이나 언론사 이름에 들어가면 결과에서 뺍니다 · 띄어쓰기로 여러 개" />
    <select id="sc-year"></select>
    <select id="sc-range" title="한 번에 훑을 기간 — 넓힐수록 느려집니다">
      <option value="1">올해</option>
      <option value="3">최근 3년</option>
      <option value="5">최근 5년</option>
      <option value="all">전체 (1990~)</option>
    </select>
    <select id="sc-park"></select>
    <select id="sc-sector"></select>
    <select id="sc-conf" title="분류를 얼마나 믿을 수 있는지">
      <option value="0">신뢰도 전체</option>
      <option value="2">중 이상</option>
      <option value="3" selected>상만</option>
    </select>
    <label class="sc-check" title="제목에 '국립공원'이 있는 기사만 — 스치듯 언급된 기사를 뺍니다">
      <input type="checkbox" id="sc-near" checked /> 국립공원 주제만
    </label>
    <button type="submit" class="sc-go">찾기</button>
  </form>

  <div class="sc-bar">
    <div class="rk-tabs" id="sc-tabs">
      <button type="button" class="rk-tab is-on" data-view="list">목록</button>
      <button type="button" class="rk-tab" data-view="rank">인기 순위</button>
    </div>
    <span class="sc-scope">범위 <b id="sc-scope">올해</b> · 결과 <b id="sc-count">–</b><i id="sc-excount"></i></span>
  </div>

  <div id="sc-body"></div>

  <p class="db-src">
    네이버 검색 색인 기준이라 전수가 아닙니다 · 분야는 제목·요약 낱말로 자동 분류해 일부 오분류가 있습니다 ·
    기사 본문은 담지 않고 원문은 링크로 연결합니다.
  </p>
</main>

<script src="assets/js/search.js"></script>
</body>
</html>
