<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PARKNEWS · 국립공원 뉴스 지도 대시보드</title>
<meta name="description" content="국내 24곳·해외 2천여 곳 국립공원의 현안 뉴스와 통계를 지도 위에서 한눈에 보는 대시보드" />
<meta name="theme-color" content="#080b13" />

<link rel="icon" href="assets/img/knps-mark.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<!-- ===== 지도 ===== -->
<div id="map"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ===== 부팅 오버레이 ===== -->
<div id="boot">
  <div class="boot__inner">
    <div class="boot__logo">
      <span class="ring"></span><span class="ring ring--2"></span><span class="core"></span>
    </div>
    <h1 class="boot__title">PARKNEWS</h1>
    <p class="boot__sub">NATIONAL PARK NEWS MAP</p>
    <p id="boot-status">엔진 준비 중…</p>
  </div>
</div>

<!-- ===== 최상단 핫이슈 띠 ===== -->
<div class="hotbar" id="hotbar" hidden>
  <span class="hot-tag"><i></i>실시간 핫이슈</span>
  <div class="hot-view"><div class="hot-rail" id="hot-rail"></div></div>
  <button class="hot-close" id="hot-close" aria-label="핫이슈 닫기">
    <svg viewBox="0 0 24 24" width="13" height="13"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- ===== 상단 바 ===== -->
<header class="topbar glass">
  <button class="burger" id="btn-panel" aria-label="탐색 패널 열기" aria-expanded="true">
    <span></span><span></span><span></span>
  </button>
  <div class="brand">
    <span class="brand__mark"></span>
    <div>
      <h1>PARKNEWS</h1>
      <p>국립공원 현안 · 국내외 뉴스 · 보전기관</p>
    </div>
  </div>

  <div class="topbar__stats">
    <div class="stat stat--points">
      <span class="stat__k">표시 지점</span>
      <span class="stat__v" id="stat-points">–</span>
    </div>
    <div class="stat stat--clock">
      <span class="stat__k">현재 시각 (KST)</span>
      <span class="stat__v mono" id="clock">--:--:--</span>
    </div>
    <a class="dlbtn dlbtn--dash" href="dashboard.html" title="섹터별 뉴스 대시보드">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      섹터 뉴스
    </a>
    <a class="dlbtn dlbtn--search" href="search.html" title="뉴스 검색">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      뉴스검색
    </a>
    <a class="dlbtn dlbtn--data" href="data.html" title="데이터셋 내려받기">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      자료받기
    </a>
    <button class="dlbtn dlbtn--stat" id="btn-stats">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 3v16a2 2 0 002 2h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 15l4-5 3 3 5-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      통계
    </button>
    <button class="dlbtn dlbtn--alt" id="btn-ranking">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      인기뉴스
    </button>
    <button class="iconbtn iconbtn--top" id="btn-light" title="밝은 지도" aria-label="밝은 지도 전환">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- ===== 좌측 컨트롤 패널 ===== -->
<section class="panel glass" id="panel">
  <button class="panel__fold" id="panel-fold" aria-label="패널 접기/펼치기">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="panel__body">
    <!-- 국내 / 해외 -->
    <div class="ex-tabs">
      <button class="ex-tab is-on" id="ex-tab-kr">
        <span class="ex-tab__dot" style="--c:var(--kr)"></span>국내
      </button>
      <button class="ex-tab" id="ex-tab-global">
        <span class="ex-tab__dot" style="--c:var(--global)"></span>해외
      </button>
      <button class="ex-tab" id="ex-tab-org">
        <span class="ex-tab__dot" style="--c:var(--org)"></span>기관
      </button>
      <span class="ex-tab__count" id="ex-count">–</span>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="ex-search" type="search" placeholder="국내 공원 검색 (예: 설악)" autocomplete="off" />
    </label>

    <nav class="ex-crumb" id="ex-crumb"></nav>
    <ul class="ex-list" id="ex-list"></ul>

    <div class="group">
      <p class="group__t">레이어</p>
      <label class="switch">
        <input type="checkbox" id="toggle-bounds" checked />
        <span class="switch__ui"></span>
        <span class="switch__lb">국립공원 경계</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="toggle-all" />
        <span class="switch__ui"></span>
        <span class="switch__lb">모든 지점 표시</span>
      </label>
      <label class="switch">
        <!-- 기본값이 밝은 지도라 켜진 상태로 시작한다 (JS 가 저장된 설정으로 덮어씀) -->
        <input type="checkbox" id="toggle-light" checked />
        <span class="switch__ui"></span>
        <span class="switch__lb">밝은 지도</span>
      </label>
    </div>

    <button class="ghostbtn" id="btn-home">전체 지도로 돌아가기</button>
  </div>
</section>

<!-- ===== 뉴스 통계 ===== -->
<div class="dg-overlay" id="stats" role="dialog" aria-modal="true" aria-label="뉴스 통계">
  <div class="dg-panel glass">
    <header class="dg-bar">
      <div class="dg-bar__l"><b>뉴스 통계</b></div>
      <div class="dg-bar__r">
        <button class="iconbtn" id="st-close" aria-label="닫기">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="dg-scroll" id="st-body"></div>
  </div>
</div>

<!-- ===== 통합 인기뉴스 순위 ===== -->
<div class="dg-overlay" id="ranking" role="dialog" aria-modal="true" aria-label="통합 인기뉴스 순위">
  <div class="dg-panel glass">
    <header class="dg-bar">
      <div class="dg-bar__l">
        <b>통합 인기뉴스 순위</b>
        <div class="rk-tabs">
          <button class="rk-tab is-on" id="rk-tab-kr">국내</button>
          <button class="rk-tab" id="rk-tab-global">국외</button>
        </div>
        <div class="rk-tabs rk-tabs--period" id="rk-periods" role="group" aria-label="집계 기간">
          <button class="rk-tab is-on" data-period="live">실시간</button>
          <button class="rk-tab" data-period="day">일간</button>
          <button class="rk-tab" data-period="week">주간</button>
          <button class="rk-tab" data-period="month">월간</button>
          <button class="rk-tab" data-period="year">연간</button>
        </div>
      </div>
      <div class="dg-bar__r">
        <button class="ghostbtn ghostbtn--sm" id="rk-refresh">새로고침</button>
        <button class="iconbtn" id="rk-close" aria-label="닫기">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <!-- 분야 고르기 — 구조활동만 따로 볼 수 있습니다 -->
    <nav class="rk-sectors" id="rk-sectors" aria-label="분야 선택"></nav>
    <!-- 국내 24곳 — 공원 하나만 골라서 볼 수 있습니다 -->
    <nav class="rk-parks" id="rk-parks" aria-label="공원 선택" hidden></nav>
    <div class="dg-scroll" id="rk-body"></div>
  </div>
</div>

<!-- ===== 우측 사이드바 ===== -->
<button class="sb-toggle glass" id="sb-toggle" aria-label="사이드바 열기/닫기">
  <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<aside class="sidebar glass" id="sidebar" aria-label="지역 상세 브리핑">
  <header class="sb-top">
    <span class="sb-live"><i></i>LIVE BRIEFING</span>
    <button id="sb-close" class="iconbtn" aria-label="닫기">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div id="sb-body" class="sb-scroll">
    <div class="sb-empty">
      <div class="sb-empty__icon">◎</div>
      <p>지도의 마커를 클릭하면<br>해당 공원의 뉴스 · 트렌드 · 홈페이지가 열립니다.</p>
    </div>
  </div>
</aside>

<!-- ===== 하단 헤드라인 티커 ===== -->
<div class="ticker glass" id="ticker" hidden>
  <span class="ticker__tag">HEADLINES</span>
  <div class="ticker__view"><div class="ticker__rail" id="ticker-rail"></div></div>
</div>

<!-- ===== 스크립트 ===== -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/regions.js"></script>
<!-- 해외 공원은 assets/data/parks-global.json 을 탐색기가 지연 로드합니다.
     (regions-global.js 는 그 데이터를 만들 때 쓰는 큐레이션 원본입니다) -->
<script src="assets/js/taxonomy.js"></script>
<script src="assets/js/news.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/explorer.js"></script>
<script src="assets/js/hotbar.js"></script>
<script src="assets/js/ranking.js"></script>
<script src="assets/js/stats.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
