# 데이터셋 자동 갱신
#
# 뉴스는 계속 쌓이는데 데이터셋은 사람이 스크립트를 돌려야 갱신됐습니다.
# 매달 1일 새벽에 알아서 다시 만들어 저장소에 올립니다.
#
# API 키가 필요 없습니다 — 스크립트는 parknews.vercel.app 의 API 만 부르고
# 키는 Vercel 이 들고 있습니다.
#
# 월 호출량은 한도의 극히 일부입니다 (검색 1,570회 / 775,000, 트렌드 6회 / 50,000).

name: 데이터셋 갱신

on:
  schedule:
    - cron: '0 19 1 * *'      # 매달 1일 04:00 KST (UTC 19:00 = 전날)
  workflow_dispatch:           # 필요할 때 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 국내 뉴스 수집
        run: python tools/build_news_archive.py _dataset

      - name: 해외 뉴스 수집
        run: python tools/build_global_news.py _dataset

      - name: 검색 관심도 수집
        run: python tools/build_trend_dataset.py _dataset

      - name: 월간 동향·피벗
        run: python tools/build_monthly_report.py _dataset

      - name: 포털 형식 묶음
        run: python tools/build_portal_package.py _dataset

      - name: 검색 색인
        run: python tools/build_search_index.py _dataset

      - name: 내려받기용으로 싣기
        run: python tools/publish_dataset.py _dataset

      - name: 커밋
        run: |
          git config user.name  "parknews-bot"
          git config user.email "noreply@github.com"
          git add data/dataset data/search
          if git diff --cached --quiet; then
            echo "달라진 게 없습니다."
            exit 0
          fi
          COUNT=$(python - <<'PY'
          import json, io
          print(json.load(io.open('data/search/index.json', encoding='utf-8'))['total'])
          PY
          )
          git commit -m "데이터셋 자동 갱신 — 기사 ${COUNT}건

          매달 1일 자동 실행 (.github/workflows/dataset.yml)
          국내·해외 뉴스, 검색 관심도, 피벗, 검색 색인을 새로 만들었습니다."
          git push
