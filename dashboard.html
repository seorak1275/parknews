<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PARKNEWS · 섹터별 뉴스 대시보드</title>
<meta name="description" content="국립공원 뉴스를 행정 · 재난안전 · 자원보전 · 탐방시설 분야로 나눠 한눈에 보는 대시보드" />

<link rel="icon" href="assets/img/knps-mark.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />

<body class="db-page">

<header class="topbar glass">
  <a class="brand" href="./">
    <span class="brand__mark"></span>
    <div>
      <h1>PARKNEWS</h1>
      <p>섹터별 뉴스 대시보드</p>
    </div>
  </a>
  <div class="topbar__stats">
    <button class="dlbtn" id="db-refresh">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 12a8 8 0 11-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      새로고침
    </button>
    <a class="dlbtn dlbtn--search" href="search.html" title="뉴스 검색">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      뉴스검색
    </a>
    <a class="dlbtn dlbtn--data" href="data.html" title="데이터셋 내려받기">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      자료받기
    </a>
    <!-- 지금 보고 있는 공원이 열린 채로 지도가 뜹니다 (sector.js 가 주소를 갱신) -->
    <a class="dlbtn dlbtn--stat" id="db-map" href="./">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      지도 돌아가기
    </a>
  </div>
</header>

<main class="db-wrap">
  <div class="db-head">
    <h2>섹터별 국립공원 뉴스 — <span id="db-scope">국내 국립공원 전체</span></h2>
    <p>최근 기사를 <b>구조활동 · 재난안전 · 자원보전 · 탐방시설 · 행정</b> 다섯 분야로 자동 분류합니다.
       기사 제목·요약의 키워드 기반이라 일부 오분류가 있을 수 있습니다.</p>
  </div>

  <!-- 공원별 보기 — 누르면 그 공원 기사만 분류합니다 (뒤로가기로 되돌아옴) -->
  <nav class="db-parks" id="db-parks" aria-label="공원 선택"></nav>

  <div class="db-tiles" id="db-tiles"></div>
  <div class="db-grid" id="db-grid"></div>

  <p class="db-src">출처: 구글 뉴스 검색 · 클릭하면 원문 기사로 이동합니다.</p>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/regions.js"></script>
<script src="assets/js/taxonomy.js"></script>
